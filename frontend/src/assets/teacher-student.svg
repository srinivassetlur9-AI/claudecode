    <path d="M540 350c14 12 40 12 56 0" stroke="#a7bff0" stroke-width="14" stroke-linecap="round"/>

    <!-- floating ideas -->
    <circle cx="500" cy="70" r="16" fill="#dbe6fb" stroke="#9db8ee" stroke-width="4"/>
    <path d="M494 70h12M500 64v12" stroke="#5b86e0" stroke-width="4" stroke-linecap="round"/>
    <path d="M565 110l8 16 18 3-13 12 3 18-16-9-16 9 3-18-13-12 18-3z" fill="#dbe6fb" stroke="#9db8ee" stroke-width="3" stroke-linejoin="round"/>
