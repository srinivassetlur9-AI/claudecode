server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: lms-identity
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lms_identity?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:lms}
    password: ${DB_PASSWORD:lms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  # Real email delivery. Leave MAIL_HOST empty to fall back to logging links to the console (non-prod only).
  # Gmail example: MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USER=you@gmail.com MAIL_PASSWORD=<app password>
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  health:
    mail:
      enabled: false # an unreachable SMTP server must not mark the whole app DOWN
  endpoints:
    web:
      exposure:
        include: health

lms:
  jwt:
    # Must be at least 32 bytes. Override with JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    access-ttl-minutes: 15
    refresh-ttl-days: 14
  security:
    max-failed-attempts: 5
    lockout-minutes: 15
    rate-limit-per-minute: 10
  tokens:
    email-verify-hours: 24
    otp-minutes: 10
    reset-minutes: 30
  commerce:
    max-devices: 2          # mandatory per-learner device limit
    refund-window-days: 7
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  mail-from: ${MAIL_FROM:no-reply@lms.local}
  log-otp: ${LOG_OTP:false}
  frontend-base-url: ${FRONTEND_URL:http://localhost:5173}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    seed-demo-users: ${SEED_DEMO_USERS:false}
